[tool.poetry]
name = "qontinui-mcp"
version = "0.1.0"
description = "MCP server for Qontinui visual automation - enables AI-powered workflow generation and execution"
authors = ["Qontinui Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "qontinui_mcp", from = "src"}]

[tool.poetry.scripts]
qontinui-mcp = "qontinui_mcp.server:main"

[tool.poetry.dependencies]
python = "^3.12"
mcp = "^1.0.0"
pydantic = "^2.0.0"
# Optional: psycopg is only used by the search_events tool. If not installed,
# the tool returns an informative error instead of crashing server startup.
psycopg = { version = "^3.2", optional = true, extras = ["binary"] }

[tool.poetry.extras]
events = ["psycopg"]

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
ruff = "^0.1.0"
mypy = "^1.8.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
